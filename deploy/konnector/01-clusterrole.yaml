apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-bind-konnector
rules:
- apiGroups:
  - v1alpha2.kube-bind.io
  resources:
  - "*"
  verbs:
  - "*"
- apiGroups:
  - core
  resources:
  - secrets
  - namespaces
  verbs:
  - '*'
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - '*'
